# lefthook.yml
pre-commit:
  parallel: true
  commands:
    frontend-lint:
      root: "frontend/"
      glob: "*.{js,ts,jsx,tsx,json,md}"
      run: npx prettier --write {staged_files} && git add {staged_files}
    backend-lint:
      root: "backend/"
      glob: "*.py"
      run: ruff check --fix {staged_files} && ruff format {staged_files} && git add {staged_files}
