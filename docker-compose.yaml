version: "3.9"

services:
  postgres:
    image: postgres:18
    container_name: pocket-postgers
    environment:
      POSTGRES_USER: pocket_user
      POSTGRES_PASSWORD: pocket_pass
      POSTGRES_DB: pocket_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
    name: pocket-postgres-data
